[project]
name = "rajasthan-ror"
version = "0.1.0"
description = "Rajasthan land records (jamabandi) via Bhu-Naksha: khatedar name, father, jati and residence per plot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gaurav Sood" }]
keywords = ["rajasthan", "land-records", "bhunaksha", "jamabandi", "caste", "india", "scraper"]
dependencies = [
  "certifi>=2024.2",
  "indic-transliteration>=2.3.82",
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "isort>=5", "flake8>=7"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bhunaksha", "list_locations", "fetch_plots", "parse_plots", "categorise"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
